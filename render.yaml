services:
  - type: web
    name: crisismesh-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false # Set securely in the Render dashboard
      - key: FRONTEND_URL
        sync: false # Set to your Vercel URL (e.g. https://crisismesh.vercel.app)
      - key: JWT_SECRET
        generateValue: true
